version: 2.1
orbs:
  node: circleci/node@5.0.2

jobs:
  lint-fe:
    executor:
      name: node/default
      tag: "20.19.0"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run lint
          name: Lint JS code
  build-tauri:
    docker:
      - image: cimg/rust:1.88.0-node
    steps:
      - checkout
      - node/install:
          node-version: "20.19.0"
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Install Tauri v2 Linux dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm run build
      - run: npm run tauri:test
      - run: npm run tauri:build
workflows:
  build-all:
    jobs:
      - lint-fe
      - build-tauri
