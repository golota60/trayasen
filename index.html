<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/carrot.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trayasen</title>
  </head>

  <body>
    <div data-tauri-drag-region class="titlebar">
      <button
        type="button"
        class="titlebar-button"
        id="titlebar-minimize"
        aria-label="Minimize window"
      >
        <img src="/minus-line.svg" alt="minimize" />
      </button>
      <button
        type="button"
        class="titlebar-button"
        id="titlebar-maximize"
        aria-label="Maximize window"
      >
        <img src="/window-max.svg" alt="maximize" />
      </button>
      <button
        type="button"
        class="titlebar-button"
        id="titlebar-close"
        aria-label="Close window"
      >
        <img src="/close-line.svg" alt="close" />
      </button>
    </div>
    <div id="root">
      <p style="color: #f5f7fa">Loading, the app is initializing...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
